<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="TakeSure logo">
  <defs>
    <!-- The mark: an upright blister strip, six plain pills, one pill green with a white tick ("this one"). -->
    <g id="mark">
      <rect x="0" y="0" width="200" height="280" rx="36" fill="#111111"/>
      <circle cx="64" cy="64" r="31" fill="#F6F6F3"/>
      <circle cx="136" cy="64" r="31" fill="#1E7A46"/>
      <path d="M121 65 l11 11 l20 -22" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="140" r="31" fill="#F6F6F3"/>
      <circle cx="136" cy="140" r="31" fill="#F6F6F3"/>
      <circle cx="64" cy="216" r="31" fill="#F6F6F3"/>
      <circle cx="136" cy="216" r="31" fill="#F6F6F3"/>
    </g>
    <!-- App icon tile: the mark centred on paper. -->
    <g id="tile">
      <rect x="0" y="0" width="400" height="400" rx="90" fill="#F6F6F3"/>
      <use href="#mark" transform="translate(85 39) scale(1.15)"/>
    </g>
  </defs>

  <rect width="1200" height="820" fill="#FFFFFF"/>

  <!-- Lockup -->
  <use href="#mark" transform="translate(120 150) scale(1.15)"/>
  <text x="430" y="355" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="600" letter-spacing="-2" fill="#111111">TakeSure</text>
  <text x="434" y="420" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#5C5C57">Know which medicine to take.</text>

  <!-- App icon at real sizes -->
  <text x="120" y="560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5C5C57">App icon at 180, 120, 60 and 29 px</text>
  <rect x="110" y="580" width="560" height="200" fill="none"/>
  <use href="#tile" transform="translate(120 585) scale(0.45)"/>
  <use href="#tile" transform="translate(330 615) scale(0.3)"/>
  <use href="#tile" transform="translate(480 645) scale(0.15)"/>
  <use href="#tile" transform="translate(570 660) scale(0.0725)"/>

  <!-- Dark mode tile -->
  <text x="720" y="560" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#5C5C57">On a dark home screen</text>
  <rect x="720" y="580" width="360" height="170" rx="24" fill="#121212"/>
  <use href="#tile" transform="translate(760 595) scale(0.35)"/>
  <use href="#tile" transform="translate(930 625) scale(0.15)"/>
</svg>
