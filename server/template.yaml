AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TakeSure central server — anonymous strip reading, strip catalogue, encrypted backups, family activity feed, training photos.

# Deploy (from server/):  sam build && sam deploy --guided
# Before the first deploy, create two SecureString parameters (see README.md):
#   /takesure/install-secret   random 32+ characters, signs anonymous install tokens
#   /takesure/model-key        the model provider's API key

Parameters:
  Model:
    Type: String
    Default: claude-sonnet-5-5
    Description: Model used to read strips (server-side only; the app never sees it).
  ModelCallsPerDay:
    Type: Number
    Default: 500
    Description: Global daily cap on model calls (cost cap). Above it the app reads strips on the phone.
  InstallSecretParam:
    Type: String
    Default: /takesure/install-secret
  ModelKeyParam:
    Type: String
    Default: /takesure/model-key

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      # No access logs: API Gateway access logs would record IP addresses.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      CorsConfiguration: false

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: es2023
        Minify: true
        Sourcemap: false
        EntryPoints: [src/handler.ts]
        OutExtension: [.js=.mjs]
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
    Properties:
      CodeUri: .
      Handler: handler.main
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref Bucket
          MODEL: !Ref Model
          MODEL_CALLS_PER_DAY: !Ref ModelCallsPerDay
          INSTALL_SECRET_PARAM: !Ref InstallSecretParam
          MODEL_KEY_PARAM: !Ref ModelKeyParam
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref Bucket }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${InstallSecretParam}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ModelKeyParam}
      Events:
        All:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  # One table, pay per request, TTL deletes expired items (rate counters, activity events, old backups).
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # Private bucket: encrypted backups (already ciphertext) and opt-in training photos.
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: backups-not-updated
            Prefix: vault/
            Status: Enabled
            ExpirationInDays: 400
          - Id: training-photos
            Prefix: training/
            Status: Enabled
            ExpirationInDays: 730

Outputs:
  ApiUrl:
    Description: Base URL for the app (EXPO_PUBLIC_API_URL)
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  Bucket:
    Value: !Ref Bucket
  Table:
    Value: !Ref Table
