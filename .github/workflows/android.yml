name: Android APK

on:
  push:
    branches: [main]
    # Server-only and docs-only changes don't need a new app build.
    paths-ignore: ['server/**', 'docs/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Shown in Settings so you can tell which build is installed (matches the release tag).
    env:
      EXPO_PUBLIC_BUILD: build-${{ github.run_number }}
      EXPO_PUBLIC_COMMIT: ${{ github.sha }}
      EXPO_PUBLIC_BUILT_AT: ${{ github.event.head_commit.timestamp }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/MedSync-${{ github.run_number }}.apk"
          # Same file under a fixed name, so one link always gets the newest build:
          # https://github.com/aronipani/medsync/releases/latest/download/MedSync.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/MedSync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedSync-apk
          path: out/*.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MedSync build ${{ github.run_number }}
          body: Install on Android — open this page on the phone and tap the .apk file.
          files: out/*.apk
          make_latest: true
